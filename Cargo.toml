[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
authors = ["Argus contributors"]

[workspace.dependencies]
# Shared across argus-core and the Tauri shell.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[profile.dev]
# Full DWARF debuginfo is the bulk of `target/debug` (it dwarfs the compiled
# code). Line tables keep file:line in panics/backtraces at a fraction of the
# size, with no hit to rebuild speed.
debug = "line-tables-only"

[profile.release]
# Smaller, faster release binaries for a desktop app.
codegen-units = 1
lto = true
strip = true
