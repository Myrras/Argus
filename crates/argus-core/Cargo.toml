[package]
name = "argus-core"
description = "UI-agnostic core for Argus: domain logic and state, behind a single entry point. Zero Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
# GitLab HTTP client, blocking like Podium's (`issues.rs`): every provider call
# runs on a poll thread or a `spawn_blocking` task, never on the UI thread.
# `rustls` verifies against the platform trust store, so an internal CA works.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "query"] }
# OS keychain for the GitLab token (never in an Argus file).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# GitHub's contents API returns files base64-encoded.
base64 = "0.22"
# Local review state. `bundled` compiles SQLite in, so no system library is
# needed on macOS or Windows.
rusqlite = { version = "0.37", features = ["bundled"] }

# Linux: the GitLab token goes in the Secret Service over D-Bus, as in Podium.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
