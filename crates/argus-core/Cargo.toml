[package]
name = "argus-core"
description = "UI-agnostic core for Argus: domain logic and state, behind a single entry point. Zero Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
# Parsing the GitLab instance URL (its host is what `glab` is asked for).
url = "2.5"
# GitHub's contents API returns files base64-encoded.
base64 = "0.22"
# GitLab line codes (`<sha1 of the path>_<old>_<new>`) for multi-line
# comments. Already in the tree through `uuid`.
sha1_smol = "1"
# Local review state. `bundled` compiles SQLite in, so no system library is
# needed on macOS or Windows.
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
# The then/now line diff of thread history. 2.x: 3.x needs Rust 1.85, the
# workspace targets 1.82.
similar = "2.7"

[dev-dependencies]
tempfile = "3"
