# Test + lint pipeline. The full check runs on macOS: it matches the target
# desktop platform and avoids the webkit system deps a Linux runner would need
# just to compile src-tauri. A Windows job keeps argus-core building and
# passing there too.
#
# Releases: every push to main (a merged PR) is a release. The `release` job
# turns CHANGELOG.md's `## [Unreleased]` section into the next version (patch,
# or minor/major via a PR label), bumps the manifests, commits `Release vX.Y.Z`
# to main, tags it, creates the GitHub Release and dispatches build.yml, which
# attaches the installers. The `changelog` job makes every PR add that entry.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: a cancelled run would leave a merge without a version.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release script tests
        run: |
          bash scripts/next-version.test.sh
          bash scripts/changelog.test.sh

      - name: PR adds a CHANGELOG entry
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md \
            || ! bash scripts/changelog.sh unreleased >/dev/null; then
            echo "::error file=CHANGELOG.md::Add an entry for this change under '## [Unreleased]' in CHANGELOG.md (Keep a Changelog headings, user-facing voice). Merging to main releases it."
            exit 1
          fi

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci, windows]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The template must also work with an unprotected main, so a missing key
      # only warns: checkout then falls back to GITHUB_TOKEN. On a protected
      # main that push is rejected with GH013, and this warning names the fix.
      - name: Deploy key configured?
        env:
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning title=RELEASE_DEPLOY_KEY not set::Pushing the release with GITHUB_TOKEN. That only works while main is unprotected. For a protected main: ssh-keygen -t ed25519 -N '' -C release -f release_key; gh repo deploy-key add release_key.pub --allow-write --title 'CI release'; gh secret set RELEASE_DEPLOY_KEY < release_key; delete both key files; add DeployKey as a bypass actor on main's ruleset."
          fi

      # main, not the pushed sha: a queued second run must see the first run's
      # release commit, or it would release the same version twice.
      #
      # RELEASE_DEPLOY_KEY (optional) is the private half of a deploy key with
      # write access. Pushing over SSH with it lets the release commit through a
      # protected main, via the ruleset's DeployKey bypass. Unset, the secret is
      # an empty string and checkout falls back to GITHUB_TOKEN over HTTPS, which
      # is enough for an unprotected main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # An empty Unreleased section means an earlier run already released this.
      - name: Anything to release?
        id: pending
        run: |
          if bash scripts/changelog.sh unreleased > "$RUNNER_TEMP/notes.md"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under ## [Unreleased]; already released."
          fi

      # No v* tag yet (a fresh app): the first release ships the version that is
      # already in Cargo.toml instead of bumping it.
      - name: Determine version
        if: steps.pending.outputs.release == 'true'
        run: |
          if prev=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null); then
            labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[0].labels[]?.name] | join(",")')
            tag=$(bash scripts/next-version.sh "$prev" "$labels")
            echo "$prev → $tag (labels: ${labels:-none})"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            echo "no v* tag yet → first release $tag"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Bump CHANGELOG, manifests and Cargo.lock
        if: steps.pending.outputs.release == 'true'
        run: |
          bash scripts/changelog.sh release "$VERSION" "$(date -u +%F)"
          bash scripts/sync-version.sh --set "$VERSION"
          cargo update --workspace
          bash scripts/sync-version.sh --check
          git diff --stat

      # `[skip ci]`: a push made with the deploy key (unlike one with
      # GITHUB_TOKEN) triggers workflows, and CI on the release commit or a
      # build on its tag would only repeat work. build.yml is dispatched below.
      - name: Commit, tag and push
        if: steps.pending.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $TAG [skip ci]"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub Release
        if: steps.pending.outputs.release == 'true'
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # The one and only installer build for a release: build.yml has no tag
      # trigger, so it never depends on whether [skip ci] also suppresses the
      # tag push. build.yml attaches the installers to the release.
      - name: Build installers
        if: steps.pending.outputs.release == 'true'
        run: gh workflow run build.yml --ref "$TAG"

  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` requires the frontendDist dir (../dist,
      # gitignored) to exist when src-tauri compiles.
      - name: Stub dist for src-tauri compilation
        run: mkdir -p dist

      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build
        run: pnpm build

  # argus-core only: it has no Tauri dependency, so this stays fast and catches
  # Windows-specific breakage (paths, line endings) in the domain logic.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p argus-core --all-targets -- -D warnings
      - name: Core tests
        run: cargo test -p argus-core
