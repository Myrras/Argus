name: Release label

# Every PR needs exactly one of `patch`, `minor` or `major`; it decides the
# version bump on merge (scripts/next-version.sh). Separate from CI so that
# labelling a PR doesn't re-run the full build.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions: {}

jobs:
  release-label:
    name: Release label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one release label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          count=$(jq '[.[] | select(. == "patch" or . == "minor" or . == "major")] | length' <<< "$LABELS")
          if [ "$count" -ne 1 ]; then
            echo "::error::Add exactly one release label to this PR: patch, minor or major (found $count)."
            exit 1
          fi
